name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (pint)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: ./vendor/bin/pint --test

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '8.*',  testbench: '^6.0', phpunit: '^9.5' }
          - { php: '8.1', laravel: '9.*',  testbench: '^7.0', phpunit: '^9.5' }
          - { php: '8.1', laravel: '10.*', testbench: '^8.0', phpunit: '^10.0' }
          - { php: '8.2', laravel: '10.*', testbench: '^8.0', phpunit: '^10.0' }
          - { php: '8.2', laravel: '11.*', testbench: '^9.0', phpunit: '^10.5' }
          - { php: '8.3', laravel: '11.*', testbench: '^9.0', phpunit: '^10.5' }
          - { php: '8.2', laravel: '12.*', testbench: '^10.0', phpunit: '^11.0' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0', phpunit: '^11.0' }
          - { php: '8.4', laravel: '12.*', testbench: '^10.0', phpunit: '^11.0' }
          - { php: '8.3', laravel: '13.*', testbench: '^11.0', phpunit: '^11.0' }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', phpunit: '^11.0' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Pin Laravel + Testbench + PHPUnit for this row
        run: |
          composer require --dev --no-update --no-interaction \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: ./vendor/bin/phpunit
